[project]
name = "slmkit"
version = "0.1.0"
description = "Distil a ~0.8B model for one narrow task: Langfuse traces -> Distil Labs -> vLLM on Runpod"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.22",
  "langfuse>=5.0.2",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.7",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slmkit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long help strings/URLs; keep code readable rather than wrapped
